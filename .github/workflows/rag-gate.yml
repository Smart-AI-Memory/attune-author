name: RAG Gate

# Runs the smoke eval before any publish to PyPI.
# Replaces the Vercel Blue-Green model from the strategic plan:
# this is a PyPI package, not a web app.
#
# Blue-Green mapping:
#   Blue  = stable release on pypi.org        (publish.yml, environment: pypi)
#   Green = candidate installed from source   (this workflow)
#
# Gate logic:
#   Pass → drift check is clean; a labeled PR's eval gate is satisfied.
#   Fail → a labeled PR's eval gate is red. (publish.yml does NOT `needs:`
#          this job today — it gates nothing in the publish path. The gate
#          is a weekly drift detector plus an opt-in `live-eval` PR check.)
#
# No (or rejected) eval key:
#   If neither ATTUNE_CI_EVAL_KEY nor ANTHROPIC_API_KEY is set, the gate
#   cannot make live calls. It SKIPS (green, with a Step Summary note)
#   rather than crashing — a missing secret is a config gap, not a
#   regression. Provision ATTUNE_CI_EVAL_KEY to enable real drift checks.
#   A key that IS set but Anthropic rejects (401/403 — expired/revoked/
#   wrong value) is caught by a zero-token auth preflight and skipped the
#   same way (green, ::warning::), so a bad secret is a one-line "rotate
#   the key" notice instead of a recurring red scheduled run.
#
# Cooldown (30 min between publish attempts):
#   Enforced by GitHub Environment protection rule on the `pypi` environment.
#   Settings → Environments → pypi → Wait timer: 30 minutes.
#   No workflow-level sleep needed.
#
# Cost: ~10 answer calls + ~10 judge calls (~$0.10–0.30 per run).
# Hard cap: ATTUNE_CI_EVAL_KEY has $20/month limit in the Anthropic
# console — calls beyond that are rejected by the API, not by us.
#
# Triggers:
#   - workflow_dispatch — manual run (e.g. pre-publish check).
#   - schedule (weekly Mon 13:00 UTC) — drift detection between releases.
#   - pull_request with label "live-eval" — opt-in PR gate so contributors
#     can validate eval-affecting changes before merge without paying for
#     every push. See specs/test-strategy-pass-2/ for the rationale.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running the gate manually?"
        required: false
        default: "pre-publish check"

  # Run weekly so regressions from model drift surface before a release.
  # Monday 13:00 UTC — one hour before cross-repo-compat.yml (14:00 UTC).
  schedule:
    - cron: "0 13 * * 1"

  # Opt-in PR gate: only runs when the "live-eval" label is applied.
  # Adds ~$0.20 per labeled push; the cap is the Anthropic console
  # monthly limit on ATTUNE_CI_EVAL_KEY ($20/month hard).
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  smoke-eval:
    name: RAG smoke eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate the pull_request trigger: only the "live-eval" label fires us.
    # workflow_dispatch and schedule always run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'live-eval'

    env:
      # CI pins the premium tier to sonnet-5 (specs/fable-model-tiers,
      # decision 2): the default premium model is claude-fable-5, whose
      # per-run cost would invalidate the $5/$20 ATTUNE_CI_EVAL_KEY caps
      # this workflow's budget is built on. The guard step below fails
      # the job if this pin ever goes missing — do not remove either
      # without re-costing the gate.
      ATTUNE_MODEL_PREMIUM: claude-sonnet-5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for eval API key
        id: keycheck
        # Secrets can't be referenced in `if:` directly, so resolve the key
        # into env here and expose a plain boolean output the later steps
        # gate on. When the key is absent — or present but rejected by a
        # zero-token auth preflight (401/403) — write a Step Summary note and
        # skip the run so the job ends green-but-skipped instead of crashing
        # on the first API call (exit 2: auth error / "invalid x-api-key").
        env:
          EVAL_KEY: ${{ secrets.ATTUNE_CI_EVAL_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$EVAL_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ RAG Gate skipped — no eval API key configured"
              echo ""
              echo "Neither \`ATTUNE_CI_EVAL_KEY\` nor \`ANTHROPIC_API_KEY\` is set, so the"
              echo "smoke eval cannot make live calls. Provision \`ATTUNE_CI_EVAL_KEY\`"
              echo "(repo → Settings → Secrets → Actions) to enable live drift detection."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::RAG Gate skipped — no eval API key configured."
          else
            # A key is present — preflight-validate it with a zero-token,
            # auth-only call (GET /v1/models). A present-but-rejected key
            # (expired/revoked/wrong value) is a secret-ops gap, not a
            # corpus/code regression: treat it like a missing key and skip
            # green-with-warning instead of letting the full eval hard-fail
            # red on the first 401. Only 401/403 count as "rejected";
            # transient codes (429/5xx/network → 000) fall through so the
            # real eval still surfaces them.
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "x-api-key: $EVAL_KEY" \
              -H "anthropic-version: 2023-06-01" \
              https://api.anthropic.com/v1/models || echo 000)"
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "has_key=false" >> "$GITHUB_OUTPUT"
              {
                echo "### ⏭️ RAG Gate skipped — eval API key rejected (HTTP $code)"
                echo ""
                echo "\`ATTUNE_CI_EVAL_KEY\` (or the \`ANTHROPIC_API_KEY\` fallback) is set, but"
                echo "Anthropic rejected it (\`$code\`) — expired, revoked, or wrong value."
                echo "Rotate the secret at repo → Settings → Secrets → Actions. Skipping"
                echo "rather than failing: a bad secret is an ops gap, not a regression."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::RAG Gate skipped — eval API key rejected (HTTP $code). Rotate ATTUNE_CI_EVAL_KEY."
            else
              echo "has_key=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.keycheck.outputs.has_key == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with eval dependencies
        if: steps.keycheck.outputs.has_key == 'true'
        # Installs from source (the "Green" candidate) — not from PyPI.
        # python-dotenv is included so smoke_eval.py load_dotenv() is a no-op
        # in CI (ANTHROPIC_API_KEY comes from the secret, not a .env file).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ai]"
          python -m pip install pyyaml python-dotenv

      - name: Guard — ATTUNE_MODEL_PREMIUM must be pinned for live evals
        if: steps.keycheck.outputs.has_key == 'true'
        # Mirrors the API-key guard in tests.yml: a regression alarm, not a
        # routine check. If a future workflow edit drops the job-level
        # ATTUNE_MODEL_PREMIUM pin, live evals would silently run on the
        # premium default (claude-fable-5) and blow through the
        # ATTUNE_CI_EVAL_KEY monthly caps. Fail loudly instead.
        run: |
          if [ -z "${ATTUNE_MODEL_PREMIUM:-}" ]; then
            echo "::error::ATTUNE_MODEL_PREMIUM is not set for the live-eval job."
            echo "::error::Without the pin, evals run on the premium default (claude-fable-5) and invalidate the \$5/\$20 ATTUNE_CI_EVAL_KEY cost caps."
            echo "::error::Restore 'ATTUNE_MODEL_PREMIUM: claude-sonnet-5' in the smoke-eval job env (see specs/fable-model-tiers)."
            exit 1
          fi
          echo "ATTUNE_MODEL_PREMIUM pinned to: $ATTUNE_MODEL_PREMIUM"

      - name: Run smoke eval
        if: steps.keycheck.outputs.has_key == 'true'
        env:
          # Prefer the dedicated CI eval key (capped at $20/month in the
          # Anthropic console). Falls back to the legacy ANTHROPIC_API_KEY
          # secret while the rotation is in flight; remove the fallback
          # once ATTUNE_CI_EVAL_KEY is provisioned.
          ANTHROPIC_API_KEY: ${{ secrets.ATTUNE_CI_EVAL_KEY || secrets.ANTHROPIC_API_KEY }}
          NO_COLOR: "1"
        run: |
          python benchmarks/smoke_eval.py --out smoke_results.json

      - name: Estimate cost
        if: always() && steps.keycheck.outputs.has_key == 'true'
        run: |
          # Approximate per-run cost: ~10 answer calls + ~10 judge calls.
          # Refine when smoke_eval.py emits token counts in its output.
          # v1: emit a fixed range as a CI notice so future spend reviews
          # have a stdout breadcrumb.
          echo "::notice::Estimated cost for this run: \$0.10–0.30 (10 answer + 10 judge calls)."

      - name: Upload eval results
        if: always() && steps.keycheck.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-results
          path: smoke_results.json
          retention-days: 30

      - name: Annotate PR with gate summary
        if: always() && github.event_name == 'pull_request' && steps.keycheck.outputs.has_key == 'true'
        run: |
          python - <<'EOF'
          import json, os, sys
          data = json.loads(open("smoke_results.json").read())
          m = data["metrics"]
          gates = data["gates"]
          passed = data["exit_code"] == 0
          icon = "✅" if passed else "❌"
          status = "PASSED" if passed else "FAILED"
          lines = [
              f"## {icon} RAG Gate {status}",
              "",
              "| Metric | Value | Gate | Result |",
              "| :----- | ----: | ---: | :----- |",
              f"| Faithfulness (hard) | {m['faithfulness']*100:.1f}% | ≥95% | {'✅' if gates['faithfulness']['passed'] else '❌'} |",
              f"| Strict Accuracy (advisory) | {m['strict_accuracy']*100:.1f}% | ≥85% | {'✅' if gates['strict_accuracy']['passed'] else '⚠️'} |",
              "",
              f"Valid judgments: {m['total_valid']}/5",
          ]
          summary = "\n".join(lines)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(summary + "\n")
          print(summary)
          EOF
