# Draft question bank for attune-help hallucination benchmark.
#
# 40 factual questions about attune-author's internal API, each
# with a ground-truth answer verifiable by reading the source
# (cited file:line). Patrick culls to 25 by setting `include: true`.
#
# Scoring rubric (applied at judge stage, not here):
#   correct       — arg names right, return type right, no invented args;
#                   type annotations optional
#   partial       — one arg name wrong, extra arg invented, return type
#                   wrong but core call is valid
#   hallucinated  — function/module doesn't exist, arg list fabricated,
#                   wrong module, invented API

